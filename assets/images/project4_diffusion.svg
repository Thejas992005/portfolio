      <circle cx="35" cy="40" r="15" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text x="8" y="100" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">t=0 (Synthesized)</text>
