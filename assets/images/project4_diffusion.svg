  <text x="55" y="405" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Framework: PyTorch • Diffusers • ControlNet • VGG19 Perceptual Loss • CUDA FP16</text>
  <text x="630" y="405" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="12">FID SCORE: 12.4</text>
</svg>
