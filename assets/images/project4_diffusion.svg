    <!-- LoRA Attention Cross-Weights -->
    <rect x="15" y="145" width="290" height="85" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="25" y="165" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">LoRA Rank-8 Attention Adaptation</text>
    
    <rect x="25" y="178" width="120" height="12" rx="4" fill="#3b82f6"/>
    <text x="32" y="187" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8">Content Fidelity: 94%</text>

    <rect x="155" y="178" width="140" height="12" rx="4" fill="#ec4899"/>
    <text x="162" y="187" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="8">Style Consistency: 91%</text>

    <text x="25" y="215" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">CLIP ViT-L/14 Semantic Guidance</text>
  </g>

  <!-- Right: Generated Art Matrix Preview -->
  <g transform="translate(575, 95)">
