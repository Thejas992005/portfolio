  <text x="82" y="52" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">NeuroStyle • LATENT DIFFUSION &amp; PERCEPTUAL STYLE TRANSFER</text>
  <text x="560" y="52" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="12">UNET • VGG19 LOSS</text>

  <!-- Left: Content & Style Source Image Cards -->
  <g transform="translate(45, 95)">
    <!-- Content Source -->
    <rect width="160" height="115" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="12" y="22" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">CONTENT SOURCE (X)</text>
    <circle cx="80" cy="65" r="28" fill="none" stroke="#38bdf8" stroke-width="2"/>
