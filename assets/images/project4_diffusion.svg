    <g transform="translate(0, 135)">
      <rect width="160" height="115" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="12" y="22" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">STYLE REFERENCE (A)</text>
      <!-- Stylized swirls -->
      <path d="M40 75 Q 80 35, 120 75 T 140 60" fill="none" stroke="#f43f5e" stroke-width="3"/>
      <path d="M30 60 Q 70 85, 110 50" fill="none" stroke="#fb923c" stroke-width="2.5"/>
      <text x="12" y="105" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">Style Loss: conv1_1..5_1</text>
    </g>
  </g>

  <!-- Center: Diffusion UNet Denoising Steps / Latent Space -->
  <g transform="translate(230, 95)">
    <rect width="320" height="250" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
    <text x="15" y="25" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">LATENT DENOISING TRAJECTORY (T=50)</text>

    <!-- Step Progression -->
    <!-- Step t=50 (Pure Gaussian Noise) -->
    <g transform="translate(15, 45)">
      <rect width="80" height="80" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <!-- Noise pattern -->
      <circle cx="20" cy="20" r="1.5" fill="#818cf8"/>
      <circle cx="40" cy="30" r="1.5" fill="#818cf8"/>
      <circle cx="60" cy="25" r="1.5" fill="#818cf8"/>
      <circle cx="30" cy="55" r="1.5" fill="#818cf8"/>
      <circle cx="55" cy="65" r="1.5" fill="#818cf8"/>
      <text x="10" y="100" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">t=50 (Noise)</text>
    </g>

    <!-- Arrow -->
    <path d="M105 85 L120 85" stroke="#a855f7" stroke-width="2"/>

    <!-- Step t=25 (Emerging Feature Layout) -->
    <g transform="translate(125, 45)">
      <rect width="80" height="80" rx="6" fill="#2e1065" stroke="#8b5cf6" stroke-width="1"/>
      <circle cx="40" cy="40" r="18" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3"/>
      <path d="M20 50 Q 40 25, 60 50" fill="none" stroke="#c084fc" stroke-width="2"/>
      <text x="10" y="100" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">t=25 (Layout)</text>
    </g>

    <!-- Arrow -->
    <path d="M215 85 L230 85" stroke="#ec4899" stroke-width="2"/>

    <!-- Step t=0 (High Fidelity Output) -->
    <g transform="translate(235, 45)">
