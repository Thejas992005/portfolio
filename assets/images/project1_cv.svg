<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="50%" stop-color="#0d1b38"/>
      <stop offset="100%" stop-color="#050a16"/>
    </linearGradient>
    <linearGradient id="cyanPurple1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad1)"/>

  <!-- Neural / Perspective Grid -->
  <g opacity="0.15" stroke="#06b6d4" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="290" x2="800" y2="290"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="220" y1="0" x2="220" y2="450"/>
    <line x1="360" y1="0" x2="360" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
    <line x1="750" y1="0" x2="750" y2="450"/>
  </g>

  <!-- Video Stream HUD Header -->
  <rect x="40" y="30" width="720" height="45" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1"/>
  <circle cx="65" cy="52" r="6" fill="#ef4444" filter="url(#glow1)"/>
  <text x="82" y="57" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">LIVE FEED • YOLOv8 INFERENCE ENGINE</text>
  <text x="560" y="57" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="13">FPS: 45.2 | LATENCY: 18ms</text>

  <!-- Neural Feature Map / Nodes (Left Side) -->
  <g opacity="0.8">
    <!-- Connections -->
    <path d="M120 180 L220 130 L320 170 L220 250 Z" fill="none" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2" stroke-dasharray="4,4"/>
    <path d="M120 280 L220 250 L320 310 L220 370 Z" fill="none" stroke="rgba(6, 182, 212, 0.4)" stroke-width="2"/>
    <path d="M220 130 L320 310" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>

    <!-- Nodes -->
    <circle cx="120" cy="180" r="10" fill="#6366f1" filter="url(#glow1)"/>
    <circle cx="120" cy="280" r="8" fill="#06b6d4"/>
    <circle cx="220" cy="130" r="12" fill="#8b5cf6" filter="url(#glow1)"/>
    <circle cx="220" cy="250" r="14" fill="#06b6d4" filter="url(#glow1)"/>
    <circle cx="220" cy="370" r="9" fill="#6366f1"/>
    <circle cx="320" cy="170" r="11" fill="#10b981" filter="url(#glow1)"/>
    <circle cx="320" cy="310" r="13" fill="#a855f7" filter="url(#glow1)"/>
  </g>

  <!-- Object Detection Bounding Box 1 (Vehicle / Car) -->
  <g transform="translate(360, 110)">
    <rect width="210" height="150" rx="4" fill="rgba(6, 182, 212, 0.08)" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,4"/>
    <!-- Corner Accents -->
    <path d="M0 20 L0 0 L20 0 M190 0 L210 0 L210 20 M210 130 L210 150 L190 150 M20 150 L0 150 L0 130" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <!-- Label Badge -->
    <rect x="0" y="-22" width="130" height="22" rx="4" fill="#06b6d4"/>
    <text x="8" y="-6" fill="#090d16" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Vehicle: 96.4%</text>
    <!-- Crosshair Center -->
    <circle cx="105" cy="75" r="4" fill="#06b6d4"/>
    <line x1="90" y1="75" x2="120" y2="75" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="105" y1="60" x2="105" y2="90" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="10" y="140" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">bbox: [360, 110, 570, 260]</text>
  </g>

  <!-- Object Detection Bounding Box 2 (Pedestrian) -->
  <g transform="translate(600, 140)">
    <rect width="140" height="230" rx="4" fill="rgba(16, 185, 129, 0.08)" stroke="#10b981" stroke-width="2"/>
    <path d="M0 20 L0 0 L20 0 M120 0 L140 0 L140 20 M140 210 L140 230 L120 230 M20 230 L0 230 L0 210" fill="none" stroke="#10b981" stroke-width="3"/>
    <rect x="0" y="-22" width="140" height="22" rx="4" fill="#10b981"/>
    <text x="8" y="-6" fill="#090d16" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">Pedestrian: 98.1%</text>
    <circle cx="70" cy="115" r="4" fill="#10b981"/>
  </g>

  <!-- Heatmap / Segmentation Contour (Bottom Left) -->
  <g transform="translate(370, 290)">
    <rect width="200" height="90" rx="6" fill="rgba(139, 92, 246, 0.12)" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5"/>
    <rect x="0" y="-20" width="130" height="20" rx="4" fill="#8b5cf6"/>
    <text x="8" y="-5" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Mask: Road 99.2%</text>
    <path d="M10 70 Q 50 20, 100 50 T 190 30" fill="none" stroke="#a855f7" stroke-width="3" filter="url(#glow1)"/>
    <text x="10" y="80" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">mAP@0.5: 94.2%</text>
  </g>

  <!-- Bottom Metric Bar -->
  <rect x="40" y="395" width="720" height="30" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="55" y="415" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Architecture: PyTorch • YOLOv8-L Backbone • TensorRT FP16 Optimized</text>
  <text x="630" y="415" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">● CUDA READY</text>
</svg>
