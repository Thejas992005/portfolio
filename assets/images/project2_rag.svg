<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="indigoCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>

  <!-- Top Pipeline Flow Bar -->
  <rect x="40" y="25" width="720" height="45" rx="8" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
  <circle cx="65" cy="47" r="5" fill="#8b5cf6" filter="url(#glow2)"/>
  <text x="82" y="52" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">DocuMind • MULTIMODAL HYBRID RAG AGENT</text>
  <text x="560" y="52" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12">LLaMA-3-8B • CHROMADB</text>

  <!-- Left: Document Chunking & Embeddings -->
  <g transform="translate(45, 95)">
    <!-- Document Card -->
    <rect width="180" height="230" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <rect x="15" y="15" width="70" height="18" rx="4" fill="#6366f1"/>
    <text x="22" y="28" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">INPUT PDF</text>
    <line x1="15" y1="50" x2="165" y2="50" stroke="#475569" stroke-width="2"/>
    <line x1="15" y1="65" x2="140" y2="65" stroke="#334155" stroke-width="2"/>
    <line x1="15" y1="80" x2="155" y2="80" stroke="#334155" stroke-width="2"/>
    <line x1="15" y1="95" x2="110" y2="95" stroke="#334155" stroke-width="2"/>

    <!-- Chunks Breakdown -->
    <rect x="15" y="120" width="150" height="30" rx="4" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="25" y="139" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="10">Chunk #1 [Token 0-512]</text>

    <rect x="15" y="160" width="150" height="30" rx="4" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="25" y="179" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="10">Chunk #2 [Token 512-1024]</text>

    <text x="15" y="215" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Dense Chunking + Overlap</text>
  </g>

  <!-- Arrow to Vector Space -->
  <path d="M235 210 L285 210" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>

  <!-- Center: High-Dimensional Vector Space & Retrieval Graph -->
  <g transform="translate(295, 95)">
    <rect width="250" height="230" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
    <text x="15" y="25" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">VECTOR EMBEDDING SPACE (d=1536)</text>
    
    <!-- Cluster 1 (Cyan) -->
    <circle cx="65" cy="80" r="28" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
    <circle cx="55" cy="75" r="4" fill="#06b6d4" filter="url(#glow2)"/>
    <circle cx="75" cy="70" r="3" fill="#06b6d4"/>
    <circle cx="65" cy="90" r="3.5" fill="#06b6d4"/>
    <text x="40" y="120" fill="#06b6d4" font-family="'JetBrains Mono', monospace" font-size="9">Cluster: Med</text>

    <!-- Cluster 2 (Purple - Query Match) -->
    <circle cx="170" cy="110" r="40" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="155" cy="100" r="5" fill="#ec4899" filter="url(#glow2)"/>
    <circle cx="180" cy="95" r="4" fill="#8b5cf6"/>
    <circle cx="165" cy="125" r="4.5" fill="#a855f7"/>
    <circle cx="190" cy="120" r="3.5" fill="#8b5cf6"/>
    <line x1="155" y1="100" x2="180" y2="95" stroke="#ec4899" stroke-width="1.5"/>
    <text x="135" y="165" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">Cosine Sim: 0.934</text>

    <!-- HNSW Graph links -->
    <path d="M75 70 Q 115 60, 155 100" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Reranker Badge -->
    <rect x="15" y="185" width="220" height="32" rx="6" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="25" y="205" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">Cross-Encoder Re-Ranking: Top 3 Chunks</text>
  </g>

  <!-- Arrow to LLM Generation -->
  <path d="M555 210 L600 210" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Right: Synthesized LLM Reasoning & Citations -->
  <g transform="translate(610, 95)">
    <rect width="150" height="230" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="1"/>
    <rect x="15" y="15" width="85" height="18" rx="4" fill="url(#purplePink)"/>
    <text x="22" y="28" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">LLM RESPONSE</text>

    <!-- Response lines -->
    <rect x="15" y="48" width="120" height="8" rx="2" fill="#38bdf8"/>
    <rect x="15" y="62" width="105" height="8" rx="2" fill="#94a3b8"/>
    <rect x="15" y="76" width="115" height="8" rx="2" fill="#94a3b8"/>
    
    <!-- Source Attribution -->
    <rect x="15" y="105" width="120" height="50" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="22" y="123" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">Source Verified [1]</text>
    <text x="22" y="137" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="8">Doc: Sec_3.2 (p. 14)</text>
    <text x="22" y="148" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="8">Precision: 92.8%</text>

    <rect x="15" y="170" width="120" height="42" rx="6" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1"/>
    <text x="22" y="188" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">Hallucination Check</text>
    <text x="22" y="202" fill="#fecdd3" font-family="'JetBrains Mono', monospace" font-size="8">Faithfulness: 0.98</text>
  </g>

  <!-- Bottom Metric Bar -->
  <rect x="40" y="380" width="720" height="40" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="55" y="405" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Framework: LangChain • LlamaIndex • BAAI/bge-large Embeddings • Fast inference via vLLM</text>
  <text x="650" y="405" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12">RAGAS: 0.91</text>
</svg>
