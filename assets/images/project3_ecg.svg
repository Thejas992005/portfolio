<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="redOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)"/>

  <!-- Top Status Bar -->
  <rect x="40" y="25" width="720" height="45" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1"/>
  <circle cx="65" cy="47" r="5" fill="#f43f5e" filter="url(#glow3)"/>
  <text x="82" y="52" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">CardioRisk AI • 12-LEAD ECG CLASSIFIER &amp; EXPLAINABLE AI</text>
  <text x="560" y="52" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">ACCURACY: 97.8% | F1: 0.96</text>

  <!-- Left: Raw 12-Lead ECG Signal Waveform Monitor -->
  <g transform="translate(45, 95)">
    <rect width="360" height="260" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    
    <!-- Grid lines -->
    <g opacity="0.15" stroke="#10b981" stroke-width="0.8">
      <line x1="20" y1="50" x2="340" y2="50"/>
      <line x1="20" y1="100" x2="340" y2="100"/>
      <line x1="20" y1="150" x2="340" y2="150"/>
      <line x1="20" y1="200" x2="340" y2="200"/>
      <line x1="60" y1="20" x2="60" y2="240"/>
      <line x1="120" y1="20" x2="120" y2="240"/>
      <line x1="180" y1="20" x2="180" y2="240"/>
      <line x1="240" y1="20" x2="240" y2="240"/>
      <line x1="300" y1="20" x2="300" y2="240"/>
    </g>

    <text x="20" y="30" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">LEAD II SIGNAL (500Hz SAMPLING)</text>

    <!-- ECG Wave Path (P-Q-R-S-T wave) -->
    <path d="M20 130 L50 130 Q 60 120, 65 130 L75 130 L80 145 L90 50 L100 160 L105 130 L115 130 Q 130 100, 145 130 L180 130 Q 190 120, 195 130 L205 130 L210 145 L220 50 L230 160 L235 130 L245 130 Q 260 100, 275 130 L310 130 Q 320 120, 325 130 L340 130" fill="none" stroke="#10b981" stroke-width="2.5" filter="url(#glow3)"/>

    <!-- Grad-CAM Highlight Zone on R-Peak and ST-segment -->
    <rect x="75" y="40" width="75" height="130" rx="4" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,2"/>
    <rect x="75" y="180" width="75" height="20" rx="3" fill="#f43f5e"/>
    <text x="80" y="194" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ST Elevation</text>

    <text x="20" y="245" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">PhysioNet Challenge 2021 Dataset (43K Patients)</text>
  </g>

  <!-- Right: 1D CNN + Bi-LSTM Architecture & Diagnostics -->
  <g transform="translate(425, 95)">
    <rect width="335" height="260" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(244, 63, 94, 0.25)" stroke-width="1"/>
    <text x="20" y="30" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">DEEP LEARNING MODEL PREDICTIONS</text>

    <!-- Prediction 1: Normal Sinus Rhythm -->
    <g transform="translate(20, 50)">
      <text x="0" y="14" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Normal Sinus Rhythm</text>
      <rect x="180" y="3" width="120" height="12" rx="6" fill="#1e293b"/>
      <rect x="180" y="3" width="15" height="12" rx="6" fill="#64748b"/>
      <text x="180" y="30" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">1.2%</text>
    </g>

    <!-- Prediction 2: Atrial Fibrillation (Detected!) -->
    <g transform="translate(20, 95)">
      <text x="0" y="14" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">Atrial Fibrillation (AF)</text>
      <rect x="180" y="3" width="120" height="12" rx="6" fill="#1e293b"/>
      <rect x="180" y="3" width="116" height="12" rx="6" fill="url(#redOrange)"/>
      <text x="180" y="30" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">97.8% (CONFIRMED)</text>
    </g>

    <!-- Prediction 3: Premature Ventricular Contractions -->
    <g transform="translate(20, 140)">
      <text x="0" y="14" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11">Ventricular Ectopy (PVC)</text>
      <rect x="180" y="3" width="120" height="12" rx="6" fill="#1e293b"/>
      <rect x="180" y="3" width="12" height="12" rx="6" fill="#64748b"/>
      <text x="180" y="30" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">0.8%</text>
    </g>

    <!-- Model Architecture Chips -->
    <g transform="translate(20, 200)">
      <rect x="0" y="0" width="85" height="24" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
      <text x="8" y="16" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">1D-CNN (x4)</text>

      <rect x="95" y="0" width="85" height="24" rx="4" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
      <text x="103" y="16" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10">Bi-LSTM (x2)</text>

      <rect x="190" y="0" width="95" height="24" rx="4" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1"/>
      <text x="198" y="16" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10">Grad-CAM XAI</text>
    </g>
  </g>

  <!-- Bottom Metric Bar -->
  <rect x="40" y="380" width="720" height="40" rx="6" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="55" y="405" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">Framework: TensorFlow 2 • Keras • Scikit-Learn • Gradio Clinical Web Dashboard</text>
  <text x="630" y="405" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12">AUROC: 0.984</text>
</svg>
