  <text x="855" y="440" fill="#64748b" font-family="monospace" font-size="10">[22:14:18] snapshot backup written s3://</text>
  <text x="855" y="465" fill="#10b981" font-family="monospace" font-size="10">[22:14:21] GET /metrics prometheus OK</text>
